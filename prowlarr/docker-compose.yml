services:
  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
      - home-network
    ports:
      - "9696:9696"
    volumes:
      - /srv/prowlarr/config:/config
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Tallinn

networks:
  proxy:
    external: true
  home-network:
    external: true
