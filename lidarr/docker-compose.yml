services:
  lidarr:
    image: ${LIDARR_IMAGE}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks: [home-network]
    ports:
      - ${WG_PRIVATE_IP}:8686:8686
    volumes:
      - /srv/lidarr/config:/config
      - /srv/media:/media
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}

networks:
  home-network: {external: true}
