services:
  radarr:
    image: ${RADARR_IMAGE}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks: [home-network]
    ports:
      - ${WG_PRIVATE_IP}:7878:7878
    volumes:
      - /srv/radarr/config:/config
      - /srv/media:/media
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}

networks:
  home-network: {external: true}
