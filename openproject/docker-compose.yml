services:
  database:
    image: ${POSTGRES17_IMAGE}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks: [internal]
    volumes:
      - /srv/databases/openproject-postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: openproject
      POSTGRES_USER: openproject
      POSTGRES_PASSWORD: ${OPENPROJECT_DB_PASSWORD}
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U openproject -d openproject']
      interval: 15s
      timeout: 5s
      retries: 20

  cache:
    image: ${REDIS_IMAGE}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks: [internal]
    healthcheck:
      test: [CMD, redis-cli, ping]

  openproject:
    image: ${OPENPROJECT_IMAGE}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    depends_on:
      database: {condition: service_healthy}
      cache: {condition: service_healthy}
    networks: [proxy, internal]
    volumes:
      - /srv/openproject/assets:/var/openproject/assets
    environment: &openproject-environment
      OPENPROJECT_HTTPS: "true"
      OPENPROJECT_HOST__NAME: openproject.${ROOT_DOMAIN}
      OPENPROJECT_SECRET_KEY_BASE: ${OPENPROJECT_SECRET_KEY_BASE}
      OPENPROJECT_ADMIN_USER__PASSWORD: ${OPENPROJECT_ADMIN_PASSWORD}
      DATABASE_URL: postgres://openproject:${OPENPROJECT_DB_PASSWORD}@database:5432/openproject
      CACHE_SERVER: redis
      CACHE_REDIS_URL: redis://cache:6379/0
      OPENPROJECT_CACHE__MEMCACHE__SERVER: ""
      TZ: ${TZ}

  worker:
    image: ${OPENPROJECT_IMAGE}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    command: [./docker/prod/worker]
    depends_on:
      database: {condition: service_healthy}
      cache: {condition: service_healthy}
    networks: [internal]
    volumes:
      - /srv/openproject/assets:/var/openproject/assets
    environment: *openproject-environment

networks:
  proxy: {external: true}
  internal: {}
