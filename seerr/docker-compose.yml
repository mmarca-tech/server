services:
  seerr:
    image: ${SEERR_IMAGE}
    init: true
    user: ${PUID}:${PGID}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks: [proxy, home-network]
    volumes:
      - /srv/seerr/config:/app/config
    environment:
      LOG_LEVEL: info
      TZ: ${TZ}
      PORT: 5055
    healthcheck:
      test: [CMD-SHELL, 'wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1']
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 5

networks:
  proxy: {external: true}
  home-network: {external: true}

