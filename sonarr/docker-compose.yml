services:
  sonarr:
    image: ${SONARR_IMAGE}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks: [home-network]
    ports:
      - ${WG_PRIVATE_IP}:8989:8989
    volumes:
      - /srv/sonarr/config:/config
      - /srv/media:/media
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}

networks:
  home-network: {external: true}
