services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - home-network
    ports:
      - "8191:8191"
    environment:
      - TZ=Europe/Tallinn
      - LOG_LEVEL=info

networks:
  home-network:
    external: true
