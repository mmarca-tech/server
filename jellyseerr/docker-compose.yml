services:
  jellyseerr:
    image: ${JELLYSEERR_IMAGE}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    volumes:
      - /srv/jellyseerr/config:/app/config
    env_file:
      - .env
    environment:
      LOG_LEVEL: info

networks:
  proxy:
    external: true
