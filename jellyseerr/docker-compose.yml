services:
  jellyseerr:
    image: ghcr.io/seerr-team/seerr:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "5055:5055"
    networks:
      - proxy
      - home-network
    volumes:
      - /srv/jellyseerr/config:/app/config
    env_file:
      - .env
    environment:
      LOG_LEVEL: info

networks:
  proxy:
    external: true
  home-network:
    external: true
