services:
  nextcloud-db:
    image: ${NEXTCLOUD_DB_IMAGE}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW --bind-address=127.0.0.1
    network_mode: host
    volumes:
      - /srv/databases/nextcloud-mariadb:/var/lib/mysql
    env_file:
      - .env
    environment:
      MARIADB_DATABASE: nextcloud
      MARIADB_USER: nextcloud
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p\"$${MARIADB_ROOT_PASSWORD}\""]
      interval: 30s
      timeout: 5s
      retries: 5

  nextcloud-redis:
    image: ${NEXTCLOUD_REDIS_IMAGE}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: ["redis-server", "--bind", "127.0.0.1", "--port", "6379"]
    network_mode: host
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

  nextcloud:
    image: ${NEXTCLOUD_APP_IMAGE}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      nextcloud-db:
        condition: service_healthy
      nextcloud-redis:
        condition: service_healthy
    network_mode: host
    volumes:
      - /srv/nextcloud/html:/var/www/html
      - /srv/nextcloud/data:/var/www/html/data
    env_file:
      - .env
    command:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        sed -ri 's/Listen 80$/Listen 11080/' /etc/apache2/ports.conf
        for f in /etc/apache2/sites-available/000-default.conf /etc/apache2/sites-enabled/000-default.conf; do
          if [[ -f "$$f" ]]; then
            sed -ri 's/:80>/:11080>/g' "$$f"
          fi
        done
        exec apache2-foreground
    environment:
      NEXTCLOUD_UPDATE: 1
      MYSQL_HOST: 127.0.0.1
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      REDIS_HOST: 127.0.0.1
      REDIS_HOST_PORT: 6379
