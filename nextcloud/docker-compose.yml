services:
  database:
    image: ${NEXTCLOUD_DB_IMAGE}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    networks: [internal]
    volumes:
      - /srv/databases/nextcloud-mariadb:/var/lib/mysql
    environment:
      MARIADB_ROOT_PASSWORD: ${NEXTCLOUD_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: nextcloud
      MARIADB_USER: nextcloud
      MARIADB_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
    healthcheck:
      test: [CMD-SHELL, 'mariadb-admin ping -h 127.0.0.1 -uroot -p"$${MARIADB_ROOT_PASSWORD}"']
      interval: 15s
      timeout: 5s
      retries: 20

  cache:
    image: ${REDIS_IMAGE}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks: [internal]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 15s
      timeout: 5s
      retries: 10

  nextcloud:
    image: ${NEXTCLOUD_APP_IMAGE}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    depends_on:
      database: {condition: service_healthy}
      cache: {condition: service_healthy}
    networks: [proxy, internal]
    volumes:
      - /srv/nextcloud/html:/var/www/html
      - /srv/nextcloud/data:/var/www/html/data
      - /srv/media:/media
    environment:
      MYSQL_HOST: database
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      REDIS_HOST: cache
      NEXTCLOUD_ADMIN_USER: ${ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: nc.${ROOT_DOMAIN}
      TRUSTED_PROXIES: 172.16.0.0/12
      OVERWRITEPROTOCOL: https
      OVERWRITEHOST: nc.${ROOT_DOMAIN}
      OVERWRITECLIURL: https://nc.${ROOT_DOMAIN}
      PHP_MEMORY_LIMIT: 1G
      PHP_UPLOAD_LIMIT: 10G

networks:
  proxy: {external: true}
  internal: {internal: true}
