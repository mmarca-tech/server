services:
  bazarr:
    image: ${BAZARR_IMAGE}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks: [home-network]
    ports:
      - ${WG_PRIVATE_IP}:6767:6767
    volumes:
      - /srv/bazarr/config:/config
      - /srv/media:/media
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}

networks:
  home-network: {external: true}
