services:
  jellyfin:
    image: ${JELLYFIN_IMAGE}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks: [proxy, home-network]
    volumes:
      - /srv/jellyfin/config:/config
      - /srv/jellyfin/cache:/cache
      - /srv/media:/media:ro
    environment:
      TZ: ${TZ}

networks:
  proxy: {external: true}
  home-network: {external: true}
