services:
  jellyfin:
    image: ${JELLYFIN_IMAGE}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    network_mode: host
    volumes:
      - /srv/jellyfin/config:/config
      - /srv/jellyfin/cache:/cache
      - /srv/jellyfin/media:/media:ro
    env_file:
      - .env
