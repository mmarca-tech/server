services:
  invidious:
    image: ${INVIDIOUS_IMAGE}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
      - invidious-net
    env_file:
      - .env
    environment:
      INVIDIOUS_CONFIG: |
        db:
          dbname: invidious
          user: invidious
          password: ${INVIDIOUS_DB_PASSWORD}
          host: invidious-db
          port: 5432
        check_tables: true
        domain: ${INVIDIOUS_DOMAIN}
        https_only: true
        external_port: 443
        registration_enabled: false
        login_enabled: true
        statistics_enabled: false
        inv_sig_helper_url: http://inv-sig-helper:12999
    depends_on:
      invidious-db:
        condition: service_healthy

  inv-sig-helper:
    image: ${INV_SIG_HELPER_IMAGE}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - invidious-net
    environment:
      RUST_LOG: info

  invidious-db:
    image: ${INVIDIOUS_DB_IMAGE}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - invidious-net
    volumes:
      - /srv/invidious/db:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: invidious
      POSTGRES_USER: invidious
      POSTGRES_PASSWORD: ${INVIDIOUS_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invidious"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  proxy:
    external: true
  invidious-net:
    internal: true
