version: '3.8'

services:
  transmission:
    image: linuxserver/transmission:latest
    container_name: transmission_fresh-transmission-1
    restart: unless-stopped
    
    ports:
      - "6969:6969"
      - "6969:6969/udp"
      - "9091:9091"
    
    volumes:
      # Downloads shared with media services
      - /srv/media/downloads:/downloads
      - /srv/media/downloads/movies:/movies
      - /srv/media/downloads/tv:/tv
      - /srv/media/downloads/music:/music
      - /srv/media/downloads/audiobooks:/audiobooks
      - /srv/media/downloads/podcasts:/podcasts
      
      # Transmission config
      - ./config:/config
    
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Tallinn
      - TRANSMISSION_DOWNLOAD_DIR=/downloads
      - TRANSMISSION_INCOMPLETE_DIR=/downloads/.incomplete
    
    networks:
      - home-network

networks:
  home-network:
    name: home-network
    external: true
