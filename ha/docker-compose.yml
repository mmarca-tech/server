services:
  homeassistant:
    image: ${HOMEASSISTANT_IMAGE}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    ports:
      - ${WG_PRIVATE_IP}:8123:8123
    volumes:
      - /srv/homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      TZ: ${TZ}
