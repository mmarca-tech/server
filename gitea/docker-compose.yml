services:
  gitea:
    image: ${GITEA_IMAGE}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    # proxy: reached by Caddy at ${GITEA_DOMAIN}. gitea: shared with the runner
    # and with runner-spawned job containers so they resolve "gitea".
    networks: [proxy, gitea]
    ports:
      # Git over SSH. This is the one host-published port outside the proxy
      # stack; docker-firewall.sh and UFW open exactly ${GITEA_SSH_PORT}. Uses
      # Gitea's built-in SSH server (port 2222 in-container), so there is no
      # interaction with the host's admin sshd on 22.
      - ${GITEA_SSH_PORT:-2222}:2222
    volumes:
      - /srv/gitea/data:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      USER_UID: ${PUID}
      USER_GID: ${PGID}
      TZ: ${TZ}
      GITEA__server__DOMAIN: ${GITEA_DOMAIN}
      GITEA__server__ROOT_URL: https://${GITEA_DOMAIN}/
      GITEA__server__SSH_DOMAIN: ${GITEA_DOMAIN}
      GITEA__server__SSH_PORT: ${GITEA_SSH_PORT:-2222}
      GITEA__server__START_SSH_SERVER: "true"
      GITEA__server__SSH_LISTEN_PORT: "2222"
      GITEA__server__LFS_START_SERVER: "true"
      # Initialise from these env vars instead of exposing the web installer.
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__database__PATH: /data/gitea/gitea.db
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__actions__ENABLED: "true"
      GITEA__repository__DEFAULT_BRANCH: main
    healthcheck:
      # curl ships in the Gitea image; wget is the busybox fallback.
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/healthz || wget -qO- http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  act-runner:
    image: ${GITEA_ACT_RUNNER_IMAGE}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks: [gitea]
    depends_on:
      gitea:
        condition: service_healthy
    volumes:
      - /srv/gitea/act-runner:/data
      # Docker backend: pipeline steps run as sibling containers on the host
      # daemon. Root-equivalent host access, same tradeoff as any CI runner.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./act-runner-config.yaml:/config.yaml:ro
    environment:
      TZ: ${TZ}
      CONFIG_FILE: /config.yaml
      # Internal address; deploy.sh generates the registration token from the
      # running Gitea instance and stores it in the root-only secrets file.
      GITEA_INSTANCE_URL: http://gitea:3000
      GITEA_RUNNER_REGISTRATION_TOKEN: ${GITEA_RUNNER_REGISTRATION_TOKEN}
      GITEA_RUNNER_NAME: ${GITEA_RUNNER_NAME:-server-act-runner}

networks:
  proxy: {external: true}
  gitea: {}
