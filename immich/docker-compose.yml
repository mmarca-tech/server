services:
  database:
    image: ${IMMICH_DB_IMAGE}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    shm_size: 128mb
    networks: [internal]
    volumes:
      - /srv/databases/immich-postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_USER: immich
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: --data-checksums
      DB_STORAGE_TYPE: SSD
    healthcheck:
      disable: false

  cache:
    image: ${IMMICH_CACHE_IMAGE}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks: [internal]
    healthcheck:
      test: [CMD-SHELL, 'redis-cli ping || exit 1']

  immich-machine-learning:
    image: ${IMMICH_ML_IMAGE}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks: [internal]
    volumes:
      - /srv/immich/model-cache:/cache
    healthcheck:
      disable: false

  immich-server:
    image: ${IMMICH_SERVER_IMAGE}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    depends_on:
      database: {condition: service_healthy}
      cache: {condition: service_healthy}
    networks: [proxy, internal]
    volumes:
      - /srv/media/immich/library:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      DB_HOSTNAME: database
      DB_USERNAME: immich
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: cache
      IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning:3003
      TZ: ${TZ}
    healthcheck:
      disable: false

networks:
  proxy: {external: true}
  internal: {}
