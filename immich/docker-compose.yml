services:
  immich-db:
    image: ${IMMICH_DB_IMAGE}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: immich
      POSTGRES_DB: immich
    env_file:
      - .env
    volumes:
      - /srv/databases/immich-postgres:/var/lib/postgresql/data
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immich -d immich"]
      interval: 30s
      timeout: 5s
      retries: 5

  immich-redis:
    image: ${IMMICH_REDIS_IMAGE}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: ["redis-server", "--bind", "127.0.0.1", "--port", "6380"]
    network_mode: host
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

  immich-server:
    image: ${IMMICH_SERVER_IMAGE}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      immich-db:
        condition: service_healthy
      immich-redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOSTNAME: 127.0.0.1
      DB_USERNAME: immich
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: 127.0.0.1
      REDIS_PORT: 6380
      IMMICH_MACHINE_LEARNING_URL: http://127.0.0.1:3003
    volumes:
      - /srv/immich/library:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    network_mode: host

  immich-machine-learning:
    image: ${IMMICH_ML_IMAGE}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - /srv/immich/model-cache:/cache
    network_mode: host
