services:
  mollysocket:
    image: ${MOLLYSOCKET_IMAGE}
    command: [server]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [internal]
    volumes:
      - /srv/mollysocket/data:/data
    environment:
      MOLLY_HOST: 127.0.0.1
      MOLLY_PORT: 8020
      MOLLY_DB: /data/ms.sqlite
      MOLLY_WEBSERVER: "false"
      MOLLY_VAPID_PRIVKEY: ${MOLLY_VAPID_PRIVKEY}
      RUST_LOG: info
    # The image's healthcheck probes the web server, which air-gapped mode
    # (MOLLY_WEBSERVER=false) disables, so it can never pass. Disable it: the
    # container is healthy in this mode, it just has no HTTP endpoint to poll.
    healthcheck:
      disable: true

  cli:
    image: ${MOLLYSOCKET_IMAGE}
    profiles: [tools]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [internal]
    volumes:
      - /srv/mollysocket/data:/data
    entrypoint: [mollysocket]
    environment:
      # Must match the server's DB so `connection add/list` act on the same
      # data (required for air-gapped setup, where the CLI is the only way in).
      MOLLY_DB: /data/ms.sqlite
      MOLLY_VAPID_PRIVKEY: ${MOLLY_VAPID_PRIVKEY}

networks:
  internal: {internal: true}
