services:
  mollysocket:
    image: ${MOLLYSOCKET_IMAGE}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - .env
    environment:
      MOLLY_HOST: ${MOLLY_HOST:-0.0.0.0}
      MOLLY_PORT: ${MOLLY_PORT:-8020}
      MOLLY_DB: ${MOLLY_DB:-/data/ms.sqlite}
      MOLLY_WEBSERVER: ${MOLLY_WEBSERVER:-false}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - /srv/mollysocket/data:/data

  mollysocket-cli:
    image: ${MOLLYSOCKET_IMAGE}
    profiles:
      - tools
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - .env
    environment:
      MOLLY_DB: ${MOLLY_DB:-/data/ms.sqlite}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - /srv/mollysocket/data:/data
    entrypoint:
      - mollysocket
