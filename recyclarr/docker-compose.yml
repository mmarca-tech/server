services:
  recyclarr:
    image: ${RECYCLARR_IMAGE}
    user: ${PUID}:${PGID}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    networks: [home-network]
    volumes:
      - /srv/recyclarr/config:/config
      - /srv/recyclarr/data:/data
    environment:
      TZ: ${TZ}
      CRON_SCHEDULE: '@daily'
      RECYCLARR_CREATE_CONFIG: 'true'
      RECYCLARR_CONFIG_DIR: /config
      RECYCLARR_DATA_DIR: /data

networks:
  home-network: {external: true}
