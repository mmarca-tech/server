services:
  tdarr:
    image: ghcr.io/haveagitgat/tdarr:latest
    container_name: tdarr
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - home-network
    ports:
      - "8265:8265"   # Web UI
      - "8266:8266"   # Server port
    volumes:
      - /srv/tdarr/server:/app/server
      - /srv/tdarr/configs:/app/configs
      - /srv/tdarr/logs:/app/logs
      - /srv/media:/media
      - /srv/tdarr/transcode_cache:/temp
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Tallinn
      - serverIP=0.0.0.0
      - serverPort=8266
      - webUIPort=8265
      - internalNode=true
      - inContainer=true

networks:
  home-network:
    external: true
