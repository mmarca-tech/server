services:
  tdarr:
    image: ${TDARR_IMAGE}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks: [home-network]
    ports:
      - ${WG_PRIVATE_IP}:8265:8265
      - ${WG_PRIVATE_IP}:8266:8266
    volumes:
      - /srv/tdarr/server:/app/server
      - /srv/tdarr/configs:/app/configs
      - /srv/tdarr/logs:/app/logs
      - /srv/tdarr/transcode_cache:/temp
      - /srv/media:/media
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      serverIP: 0.0.0.0
      serverPort: 8266
      webUIPort: 8265

networks:
  home-network: {external: true}
