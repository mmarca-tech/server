services:
  archive-proxy:
    image: nginx:alpine
    container_name: archive-proxy
    restart: unless-stopped

    # Share gluetun's network namespace so Prowlarr (also on gluetun) can
    # reach this proxy at localhost:8181 and traffic exits via VPN
    network_mode: "container:gluetun"

    volumes:
      - /srv/archive-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
