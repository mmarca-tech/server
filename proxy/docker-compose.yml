services:
  caddy:
    image: ${CADDY_IMAGE}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    networks: [proxy]
    volumes:
      - /srv/proxy/caddy-data:/data
      - /srv/proxy/caddy-config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      ROOT_DOMAIN: ${ROOT_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    healthcheck:
      test: [CMD, caddy, version]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  proxy: {external: true}
