services:
  caddy:
    image: ${CADDY_IMAGE}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - proxy
    volumes:
      - /srv/proxy/caddy-data:/data
      - /srv/proxy/caddy-config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    env_file:
      - .env

networks:
  proxy:
    external: true
