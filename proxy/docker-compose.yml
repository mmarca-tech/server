services:
  caddy:
    image: ${CADDY_IMAGE}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    network_mode: host
    volumes:
      - /srv/proxy/caddy-data:/data
      - /srv/proxy/caddy-config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    env_file:
      - .env
