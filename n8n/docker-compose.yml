services:
  n8n:
    image: ${N8N_IMAGE}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks: [proxy, internal]
    volumes:
      - /srv/n8n/data:/home/node/.n8n
    environment:
      N8N_HOST: n8n.${ROOT_DOMAIN}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.${ROOT_DOMAIN}/
      N8N_PROXY_HOPS: 1
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
      GENERIC_TIMEZONE: ${TZ}
      TZ: ${TZ}

  task-runners:
    build:
      context: .
      dockerfile: Dockerfile.runners.debian
      args:
        N8N_RUNNERS_IMAGE: ${N8N_RUNNERS_IMAGE}
    image: server-n8n-runners:2.29.10
    restart: unless-stopped
    depends_on: [n8n, browserless]
    networks: [internal]
    environment:
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_TASK_TIMEOUT: 300
      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: 15
      BROWSERLESS_WS: ws://browserless:3000?token=${BROWSERLESS_TOKEN}
    volumes:
      - ./n8n-task-runners.json:/etc/n8n-task-runners.json:ro

  browserless:
    image: ${BROWSERLESS_IMAGE}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks: [internal]
    environment:
      TOKEN: ${BROWSERLESS_TOKEN}
      TZ: ${TZ}
      CONCURRENT: 2
      QUEUED: 10
      CORS: "true"
      PREBOOT_CHROME: "true"
      KEEP_ALIVE: "true"

networks:
  proxy: {external: true}
  internal: {}
