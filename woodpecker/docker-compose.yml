services:
  woodpecker-agent:
    image: ${WOODPECKER_AGENT_IMAGE}
    restart: unless-stopped
    # The docker backend drives the host daemon through the mounted socket, so
    # the agent runs as root. no-new-privileges still blocks in-container
    # escalation beyond that already-root-equivalent socket access.
    security_opt: [no-new-privileges:true]
    networks: [woodpecker]
    volumes:
      # Persists the agent ID so it re-registers as the same agent on restart.
      - /srv/woodpecker:/etc/woodpecker
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: ${TZ}
      # Codeberg-hosted Woodpecker server: gRPC over TLS on port 443.
      WOODPECKER_SERVER: ${WOODPECKER_SERVER:-grpc.ci.codeberg.org:443}
      WOODPECKER_GRPC_SECURE: ${WOODPECKER_GRPC_SECURE:-true}
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET}
      WOODPECKER_AGENT_CONFIG_FILE: /etc/woodpecker/agent.conf
      WOODPECKER_BACKEND: docker
      # One workflow at a time: this host has 16 GB RAM and co-hosts other
      # services, and a Flutter release build already peaks around 4 GB of Gradle
      # heap plus the Dart AOT compiler. Two concurrent builds (e.g. a PR and the
      # nightly, now that both pipelines pin here) overran RAM and got OOM-killed.
      WOODPECKER_MAX_WORKFLOWS: ${WOODPECKER_MAX_WORKFLOWS:-1}
      # A custom label so a workflow can pin itself to THIS agent. Adds to the
      # built-in platform/hostname/backend/repo labels rather than replacing them.
      # The android-app release/nightly pipeline filters on `runner=openvitals` to
      # land here, where the persistent caches below live.
      WOODPECKER_AGENT_LABELS: ${WOODPECKER_AGENT_LABELS:-runner=openvitals}
      # Default volumes mounted into EVERY step container the agent spawns on the
      # host daemon. ci-flutter.sh already prefers /woodpecker/cache/{gradle,pub}
      # when those paths exist, so mounting persistent host dirs there turns on
      # cross-pipeline pub + Gradle caching with no change to the pipeline steps --
      # the single biggest cut to the nightly's build time and to the transient
      # network failures, since packages and Gradle deps stop being re-downloaded
      # every run. The dirs are created by deploy.sh; step containers run as root
      # (docker backend) so they can write regardless of the dir owner.
      WOODPECKER_BACKEND_DOCKER_VOLUMES: ${WOODPECKER_BACKEND_DOCKER_VOLUMES:-/srv/woodpecker-cache/gradle:/woodpecker/cache/gradle,/srv/woodpecker-cache/pub:/woodpecker/cache/pub}

networks:
  woodpecker: {}
