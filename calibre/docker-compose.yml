services:
  calibre-web:
    image: ${CALIBRE_IMAGE}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks: [proxy]
    volumes:
      - /srv/calibre/config:/config
      - /srv/media/books:/books
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}

networks:
  proxy: {external: true}
